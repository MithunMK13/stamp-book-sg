d wet market on Seng Poh Road in Tiong Bahru. Go in the morning when it is liveliest.","tiong-bahru-community-centre-heritage-wall":"The heritage wall at Tiong Bahru Community Centre, which opened in 1951 in a converted wartime air-raid shelter that still stands.","kampong-bahru-shophouse-row":"A row of shophouses along Kampong Bahru Road, between the old Tiong Bahru estate and the Chinatown edge.","gurdwara-sahib-silat-road":"A Sikh temple in the Bukit Merah area. An active place of worship, so dress modestly and stamp from outside.","mount-faber-cable-car-plaza":"The plaza at the Mount Faber cable car station. The cable-car ride is ticketed; the plaza stamp is free.","koon-seng-road-shophouses":"A row of multicoloured Peranakan terrace houses, among the most photographed in Singapore. People live here, so keep noise down.","red-house-bakery-building":"The old Katong Bakery and Confectionery, a red-painted landmark whose facade has been kept as a café.","sri-senpaga-vinayagar-temple":"A Hindu temple on Ceylon Road with distinctive South Indian architecture. Active worship, so stamp from outside.","eurasian-heritage-gallery":"A small museum on Ceylon Road about the Eurasian community and its place in Katong. Check opening hours before you go.","east-coast-park-bedok-jetty":"A long fishing jetty reaching out into the sea, popular at sunrise and with anglers.","church-of-the-holy-family":"The Church of the Holy Family, known as Katong Catholic Church. The current building was completed in 1999, replacing the church of 1932. Active worship.","telok-kurau-lorong-l-green-corridor":"A green walkway through Telok Kurau, between the quiet houses and the main road.","siglap-canal-coastal-exit":"A quiet coastal exit at Siglap Canal, where the canal meets East Coast Park.","old-queen-s-theatre-frontage":"The facade of the former Queen’s Theatre, a cinema that opened in the early 1930s and closed in 1982. It can still be seen from Lorong 44.","joo-chiat-complex-square":"A long- r-ris-town-park", "pasir-ris-park-adventure-playground"]}, {"id": "tamp", "name": "Tampines", "area": "Tampines", "url": "https://www.roots.gov.sg/places/places-landing/trails/tampines-heritage-trail-tampines-town-trail", "blurb": "A temple, a church, a market and green spaces.", "stops": ["tampines-chinese-temple", "catholic-church-of-the-holy-trinity", "tampines-round-market-and-food-centre", "tampines-central-park", "tampines-eco-green", "sun-plaza-park"]}, {"id": "cn", "name": "Chinatown classics", "area": "Chinatown", "url": "", "blurb": "Our own picks: temples, a mosque and old clan houses.", "stops": ["buddha-tooth-relic-temple", "smt", "thk", "nagore-dargah", "al-abrar-mosque", "ann-siang-hill-park"]}];
const PALS={"ocean": ["Ocean", 0, 0, 0, 0, 0, 0, "#0a5f87"], "forest": ["Forest", 0, 0, 0, 0, 0, 0, "#276b2b"], "orchid": ["Orchid", 0, 0, 0, 0, 0, 0, "#7b2d94"], "sunset": ["Sunset", 0, 0, 0, 0, 0, 0, "#c85306"], "slate": ["Slate", 0, 0, 0, 0, 0, 0, "#33445a"]};
const LINK={};
function setPal(p){const h=document.documentElement;if(PALS[p]){h.setAttribute("data-pal",p)}else{h.removeAttribute("data-pal");p="red"}try{localStorage.setItem("sbsg_pal",p)}catch(e){}const c=getComputedStyle(h).getPropertyValue("--cover").trim();const mt=document.querySelector('meta[name="theme-color"]');if(mt&&c)mt.setAttribute("content",c)}
function learnMore(s){const q=encodeURIComponent(s.name.replace(/\s*\(.*?\)/g,"")+" Singapore");return `<p class="meta"><b>Learn more:</b> ${LINK[s.id]?`<a href="${LINK[s.id]}" target="_blank" rel="noopener">Official page</a> · `:""}<a href="https://en.wikipedia.org/w/index.php?search=${q}" target="_blank" rel="noopener">Wikipedia</a> · <a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">Search the web</a></p>`}
let backTo=null;
function trStops(t){return t.stops.map(id=>ALL.find(s=>s.id===id)).filter(Boolean)}
function trDone(s){return !!(stamps[s.id]&&Object.keys(stamps[s.id]).length)}
function trailsView(){return `<div class="stick"><div class="row"><h2>Trails</h2><button class="btn alt xbtn" id="close">Close</button></div><p class="meta">Walks that follow Singapore’s heritage trails. Stop lists are our own picks from the spots in this app. Each trail links to the official guide for the full route.</p></div>`+TRAILS.map(t=>{const S=trStops(t);if(S.length<2)return"";const n=S.filter(trDone).length;return `<button class="tcard" data-tr="${t.id}"><b>${t.name}</b><small>${t.area} · ${n} of ${S.length} stamped${n===S.length?" ★":""}</small><div class="bar"><i style="width:${Math.round(100*n/S.length)}%"></i></div></button>`}).join("")}
function trailView(id){const t=TRAILS.find(x=>x.id===id);if(!t)return trailsView();const S=trStops(t),n=S.filter(trDone).length;
const P=S.filter(s=>s.lat);let dir="";if(P.length>=2){const w=P.slice(1,-1).slice(0,8).map(s=>s.lat+","+s.lng).join("|");dir=`<a class="btn alt" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${P[0].lat},${P[0].lng}&destination=${P[P.length-1].lat},${P[P.length-1].lng}${w?"&waypoints="+encodeURIComponent(w):""}&travelmode=walking">Walking route in Maps</a>`}
return `<div class="stick"><div class="row"><h2>${t.name}</h2><button class="btn alt xbtn" id="tback">All trails</button></div><p class="meta">${t.blurb} ${n} of ${S.length} stamped.</p></div>`+S.map((s,i)=>`<button class="tstop ${trDone(s)?"done":""}" data-ts="${t.id}" data-s="${s.id}"><i>${trDone(s)?"✓":i+1}</i><span>${s.name}</span></button>`).join("")+`<p class="meta">Stops are shown in a sensible walking order but you can do them in any order. Some are a bus or MRT ride apart.</p>`+dir+(t.url?`<a class="btn alt" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="${t.url}">Official trail guide (NHB Roots)</a>`:"")+`<button class="btn alt" id="close">Close</button>`}
function palView(){const cur=document.documentElement.getAttribute("data-pal")||"red";const all=[["red","Red",{b:"#b81f17"}]].concat(Object.entries(PALS).map(([k,v])=>[k,v[0],{b:v[7]}]));return `<button class="xclose" id="x" aria-label="Close">×</button><h2>Colours</h2><p class="meta">Pick a look. It is saved on this phone only. Dark mode still follows your phone.</p><div class="sw">`+all.map(([k,n,c])=>`<button data-pal="${k}" aria-pressed="${k===cur}"><span style="background:${c.b}"></span>${n}</button>`).join("")+`</div><button class="btn alt" id="close">Close</button>`}
const FAQ=[["How do I collect a stamp?","Walk to a spot, open its card and tap “Stamp it”. Your phone’s location is checked once, and if you are close enough the stamp lands in your book."],["What are the four times of day?","Each spot has four stamps: morning (5–11am), midday (11am–5pm), evening (5–8pm) and night (8pm–5am), Singapore time. Collect all four for a star."],["Why does it say I’m too far away?","You need to be within the check-in radius shown on the card, usually 80–200 m. Step into the open for a few seconds so your phone can get a good fix, then tap again."],["Do I need an account or internet?","No account. Stamps are saved on your phone. You need a signal to load updates and to use maps."],["What are the badges, trails and events?","Badges reward what you collect. Trails link spots into walks that follow Singapore’s heritage trails. Events lists things on in the coming weeks and links to the spots they happen at."],["Why do some spots give no badge credit?","Memorials and residents’ areas are for quiet respect, so you can stamp them but they don’t count toward badges."],["I changed phones. Can I keep my stamps?","Yes. Use “Save my stamps” at the bottom of the page and keep the file, then “Load saved stamps” on the new phone."],["A spot is wrong, closed or missing.","Tell us when you test the app. A public “Suggest a spot” form will come later."]];

function settingsView(){const n=Object.keys(stamps).length;return `<button class="xclose" id="x" aria-label="Close">×</button><h2>Profile &amp; settings</h2><p class="me-sum">${n?`${n} spot${n===1?"":"s"} stamped so far.`:"No stamps yet. Go and chop your first spot."} Everything stays on this phone.</p><button class="set" data-act="pal">Colours<small>Choose your theme</small></button><button class="set" disabled>Notifications<small>Coming soon</small></button><button class="set" data-act="bk">Save my stamps<small>Download a backup file</small></button><button class="set" data-act="rs">Load saved stamps<small>Restore from a backup file</small></button><button class="set" data-act="about">Help, about &amp; privacy<small>How it works, FAQ and what we collect</small></button><p class="me-sum" id="bkm2" role="status"></p><button class="set danger" data-act="reset">Clear my stamps<small>Removes all stamps from this phone</small></button>`}
function aboutView(){return `<button class="xclose" id="x" aria-label="Close">×</button><h2>Help, about &amp; privacy</h2>${FAQ.map(f=>`<details class="faq"><summary>${f[0]}</summary><p class="meta">${f[1]}</p></details>`).join("")}<h3>About Chop SG</h3><img src="icons/logo.png" alt="Chop SG: been there, chopped that" onerror="this.remove()" style="display:block;width:170px;max-width:60%;margin:4px auto 10px"><p class="meta">Chop SG is a free, no-account stamp collection for places around Singapore. It is an early test version.</p><h3>Your location</h3><p class="meta">Checked only when you tap “Stamp it” or “Nearby”, and only while the app is open. It never reads your location in the background. For Stamp it, the app listens for a few seconds to get an accurate fix, compares it with the spot on your phone, then stops. It is not saved and not sent anywhere.</p><h3>Your stamps and badges</h3><p class="meta">Saved only in this browser on this phone. There are no accounts, so we can’t see them and can’t restore them if you clear your browser data or “Clear my stamps”. “Save my stamps” makes a small file on your phone that you keep; we never receive it. “Load saved stamps” adds it back, for example on a new phone.</p><h3>What this app loads</h3><p class="meta">Public lists of events and temporarily hidden spots, fetched like any web page. No analytics, no ads and no trackers are in this version.</p><h3>Before it goes into app stores</h3><p class="meta">A full privacy policy and the stores’ privacy declarations will be added, and this page updated, before any feature that collects data (accounts, analytics, ads or partner offers).</p><p class="meta">Descriptions in this test version are still being checked. Please be respectful at places of worship and homes, and stay safe.</p><button class="btn alt" id="close">Close</button>`}
$("#about").onclick=()=>{$("#sheet").innerHTML=aboutView();$("#dlg").showModal();$("#close").onclick=()=>$("#dlg").close()};
if(SUGGEST_URL)$("#sg").innerHTML=`· <a href="${SUGGEST_URL}" target="_blank" rel="noopener">Suggest a spot</a>`;
$("#bk").onclick=()=>{let b=[];try{b=JSON.parse(localStorage.getItem("sbsg_badges")||"[]")}catch(e){}const txt=JSON.stringify({app:"chop-sg",version:1,saved:new Date().toISOString(),stamps,badges:b}),name="chop-sg-stamps-"+new Date().toISOString().slice(0,10)+".json";
try{const f=new File([txt],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Chop SG stamps"}).then(()=>{$("#bkm").textContent="Saved."}).catch(()=>{});return}}catch(e){}
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);$("#bkm").textContent="Saved to your downloads."};
$("#rs").onclick=()=>$("#rsf").click();
$("#rsf").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const r=new FileReader();r.onerror=()=>{$("#bkm").textContent="Couldn’t read that file."};r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.app!=="chop-sg"||!d.stamps||typeof d.stamps!=="object")throw 0;const ok=["morning","midday","evening","night"];let add=0;
Object.entries(d.stamps).forEach(([id,o])=>{if(!/^[a-z0-9-]{1,80}$/.test(id)||!o||typeof o!=="object")return;ok.forEach(m=>{const t=o[m];if(!Number.isFinite(t)||t<0||t>4e12)return;const g=stamps[id]||(stamps[id]={});if(g[m]===undefined){g[m]=t;add++}else g[m]=Math.min(g[m],t)})});
try{const s=new Set(JSON.parse(localStorage.getItem("sbsg_badges")||"[]"));(Array.isArray(d.badges)?d.badges:[]).forEach(n=>{if(typeof n==="string"&&n.length<80)s.add(n)});localStorage.setItem("sbsg_badges",JSON.stringify([...s]))}catch(e){}
save();render();$("#bkm").textContent=add?`Added ${add} stamp${add===1?"":"s"} from your file.`:"Loaded. Nothing new to add."}catch(err){$("#bkm").textContent="That isn’t a Chop SG stamp file."}};r.readAsText(f)};
$("#reset").onclick=()=>{if(confirm("Clear all your stamps?")){stamps={};save();try{localStorage.removeItem("sbsg_badges")}catch(e){}render()}};
EVENTS=LIVE?[]:DEMO;
try{fetch("events.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{const E=(j&&Array.isArray(j.events)?j.events:[]).filter(e=>e&&e.title&&e.start&&!isNaN(new Date(e.start)));if(E.length){EVENTS=E;render()}}).catch(()=>{})}catch(e){}
try{const c=JSON.parse(localStorage.getItem("sbsg_status")||"null");if(c)applyHidden(c)}catch(e){}
try{fetch("status.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{const m=j&&j.hidden&&typeof j.hidden==="object"?j.hidden:{};applyHidden(m);try{localStorage.setItem("sbsg_status",JSON.stringify(m))}catch(e){}render()}).catch(()=>{})}catch(e){}
const MN={morning:"morning",midday:"noon",evening:"evening",night:"night"};
function setImg(frame,id){if(!frame||frame.querySelector(".photo"))return;const sv=frame.querySelector("svg");if(!sv)return;const m=MN[sv.dataset.m]||"noon";
const b="images/"+id,tries=[b+"-"+m+".jpg",b+"-"+m+".png",b+"-"+m+".webp",b+".jpg"];let i=0;const im=new Image();im.className="photo";im.alt="";
im.onload=()=>{if(sv.isConnected)sv.replaceWith(im)};im.onerror=()=>{i++;if(i<tries.length)im.src=tries[i]};im.src=tries[0]}
function upgrade(){document.querySelectorAll(".spot[data-s]").forEach(b=>setImg(b.querySelector(".frame"),b.dataset.s))}
const _render=render;render=function(){_render();upgrade()};
const _open=open;open=function(id){_open(id);setImg(document.querySelector("#sheet .frame"),id)};

render();
