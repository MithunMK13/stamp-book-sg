:root[data-theme="dark"]{--bg:#0d1b1a;--surface:#15282666;--ink:#e6f1ee;--muted:#93aaa6;--line:#2b4542;--accent:#ff6b5e;--cover:#0a2c2b;--onCover:#eaf4f1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
header{background:var(--cover);color:var(--onCover);margin:0 -16px;padding:22px 16px 16px;border-radius:0 0 22px 22px}
h1{font:800 30px/1.05 "Bricolage Grotesque",Figtree,sans-serif;margin:0 0 4px;letter-spacing:-.5px}
header p{margin:0;opacity:.85;font-size:14px}
.tools{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:2px}
.chip{flex:none;border:1px solid #ffffff55;background:transparent;color:var(--onCover);border-radius:99px;padding:6px 12px;font:600 13px Figtree,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--onCover);color:var(--cover)}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:16px 0 8px;padding-bottom:4px}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 14px Figtree,sans-serif;cursor:pointer;text-align:left}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.tab small{display:block;color:var(--muted);font-weight:400}
.sub{color:var(--muted);font-size:14px;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px 12px}
.spot{background:none;border:0;padding:0;text-align:left;color:inherit;cursor:pointer;font:inherit}
.frame{background:#fff;padding:7px;outline:2px dashed var(--line);outline-offset:-1px;position:relative;box-shadow:0 1px 0 var(--line)}
.frame svg{display:block;width:100%;height:auto}
.locked svg,.locked .photo{filter:grayscale(1) contrast(.8) brightness(1.05);opacity:.55}
.frame .photo{display:block;width:100%;aspect-ratio:160/114;object-fit:cover}
.postmark{position:absolute;right:-6px;bottom:-8px;width:58px;height:58px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;text-align:center;font:800 9px/1.1 "Bricolage Grotesque",sans-serif;background:#ffffffcc;transform:rotate(-12deg)}
.postmark.thunk{animation:thunk .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes thunk{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.name{font:600 14px/1.25 Figtree,sans-serif;margin:9px 2px 3px}
.dots{display:flex;gap:4px;margin:0 2px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.tw,.postmark.thunk{animation:none}}
dialog{border:0;border-radius:18px 18px 0 0;padding:0;width:100%;max-width:520px;margin:auto auto 0;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:#000a}
.sheet{padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{font:800 22px/1.15 "Bricolage Grotesque",sans-serif;margin:12px 0 4px}
.meta{color:var(--muted);font-size:14px;margin:0 0 10px}
.desc{margin:0 0 8px;font-size:16px;line-height:1.5}
.badge{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 8px;font-size:12px;margin:0 6px 6px 0;color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:600 16px Figtree,sans-serif;cursor:pointer;margin-top:10px;background:var(--accent);color:#fff}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.msg{min-height:22px;font-size:14px;margin:8px 0 0}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>

const DS={"buddha-tooth-relic-temple":"A Tang-style temple on South Bridge Road, said to house a relic of the Buddha’s tooth. Look up at the layered red-and-gold roofs.","smt":"Singapore’s oldest Hindu temple. The tall gopuram above the entrance is covered in colourful carved deities.","thk":"A Hokkien temple for Mazu, goddess of the sea, built when the shore ran close by. Look for the carved dragons and ornate beams.","ann-siang-hill-park":"A small green hill behind the shophouses, with winding paths and quiet corners above the bars below.","keong-saik-road-shophouses":"A row of restored pre-war shophouses with painted shutters, now home to bars and cafés.","pnd":"Seven linked HDB blocks, famous for the sky garden on top. Stamp at ground level; the 50th-floor skybridge is ticketed and quota-limited.","jinrikisha-station":"The former rickshaw station on Neil Road, a reminder of the trade that once filled these streets.","nagore-dargah":"An Indian Muslim shrine on Telok Ayer Street, with an unusual mix of architectural styles. Visit quietly.","chinatown-heritage-centre-steps":"A pedestrian lane of restored shophouses on Pagoda Street, where Chinatown’s old trades and new shops meet.","former-custom-house-and-maxwell-chambers":"A historic waterfront-era building on Maxwell Road, now home to an international arbitration centre.","al-abrar-mosque":"A mosque on Telok Ayer Street built by the early Indian Muslim community. An active place of worship, so stamp from outside.","ying-fo-fui-kun":"A clan association building on Telok Ayer Street, one of the community halls that once looked after new arrivals.","club-street-shophouses":"A street of restored Peranakan-style shophouses with tiled facades and lively restaurants.","eu-yan-sang-building":"The home of a well-known traditional Chinese medicine business, in a conserved South Bridge Road building.","majestic-theatre-facade":"A former Cantonese opera house in Chinatown, a reminder of the area’s theatre-going past.","duxton-plain-park":"A narrow linear park winding between the Duxton blocks, with shaded walks and old railway-line history.","pearl-s-hill-city-park-lookout":"A quiet hilltop park above Chinatown with views over the city and the reservoir.","chinatown-complex-hawker-centre":"One of Singapore’s biggest hawker centres. Come in the morning when the stalls and the wet market are busiest.","kreta-ayer-square":"A busy community square in Chinatown. The name Kreta Ayer is Malay for ‘water cart’.","seng-wong-beo-temple":"A temple on Peck Seah Street dedicated to the City God, tucked between office towers. Active worship, so be respectful.","bbh":"A Straits Chinese ancestral home on Neil Road with a richly coloured facade. Stamp from the street; the interior is by appointment only.","merlion-park":"The famous Merlion statue spouting water at the mouth of the Singapore River, with the bay skyline behind it.","old-hill-street-police-station":"A rainbow-shuttered building with hundreds of coloured windows, now government offices. Best seen from across the road.","central-fire-station":"A red-and-white brick fire station on Hill Street, still one of the most photographed buildings in the Civic District.","fort-canning-spiral-staircase":"A popular photo spot in Fort Canning Park: a tall spiral staircase inside the old tunnel.","cavenagh-bridge":"A pedestrian suspension bridge over the Singapore River, one of the oldest crossings by the Fullerton area.","anderson-bridge":"An arched bridge over the Singapore River, near the Fullerton Hotel, with the skyline in the distance.","elgin-bridge":"A bridge over the river joining North and South Bridge Roads, with ornamental lamps along its sides.","civilian-war-memorial":"The ‘Four Chopsticks’ memorial remembering civilians killed in the Second World War. Visit quietly and respectfully.","armenian-church-of-st-gregory":"A small white church on Hill Street, one of Singapore’s oldest, set in a quiet garden.","esplanade-outdoor-theatre-steps":"The spiky ‘durian’ roofs of the Esplanade, with the outdoor theatre steps looking over the bay.","national-gallery-roof-garden":"A roof garden above the former City Hall and Supreme Court buildings, with a view of the Padang and the skyline.","asian-civilisations-museum-green":"A green by the Singapore River, close to the statue of Stamford Raffles at Empress Place.","victoria-theatre-and-concert-hall":"A neoclassical theatre and concert hall with a clock tower, on the Singapore River.","the-arts-house":"The old Parliament House, now an arts venue, in one of the city’s oldest government buildings.","the-float-and-marina-bay-promenade":"A floating platform on Marina Bay, with the Marina Bay Sands and city skyline all around.","helix-bridge":"A pedestrian bridge whose steel structure is inspired by the twist of a DNA strand. Lovely when lit at night.","supertree-grove":"The glowing tree-like structures at Gardens by the Bay. The ground-level plaza is free to visit.","marina-barrage-green-roof":"A grassy roof over Marina Barrage, popular for kite-flying, with a view of the skyline.","raffles-hotel-courtyard":"A colonial-style hotel with a white facade and a shady courtyard. Stamp from the courtyard or the front entrance.","chijmes-courtyard":"A former convent turned dining courtyard, with a Gothic chapel and a quiet fountain at its heart.","smo":"The golden-domed mosque best seen from Muscat Street. An active mosque, so dress modestly if you go in.","hjl":"A narrow lane of colourful shophouses, boutiques and street art, busiest at the weekend.","malay-heritage-centre-grounds":"The former Malay royal palace in Kampong Glam, now a museum with lawns and old trees.","alsagoff-arab-school":"A historic Islamic school building in the Kampong Glam area.","bussorah-street":"A pedestrian street lined with palms and shops, leading the eye straight to the mosque’s golden dome.","bss":"Bright staircases in the alley behind the shophouses, a favourite spot for photos.","church-of-our-lady-of-lourdes":"A neo-Gothic Catholic church in the Rochor area. An active place of worship, so stamp from outside.","kit":"A busy Waterloo Street temple, with devotees offering flowers and incense all day.","sri-krishnan-temple":"A Hindu temple on Waterloo Street, next door to the Kwan Im temple and often busy at festival times.","parkview-square-courtyard":"A glass-and-gold tower with an Art Deco look, sometimes called Singapore’s ‘Gotham’ building, with a courtyard at its base.","st-joseph-s-church-victoria-street":"A Catholic church on Victoria Street with Portuguese mission roots. An active place of worship, so stamp from outside.","sim-lim-square-plaza":"A multi-storey electronics mall that has been part of Bugis life for decades.","golden-mile-complex-plaza":"A stepped 1970s building by the road, loved by architecture fans for its bold concrete shape.","kampong-glam-royal-burial-ground":"A historic burial ground in Kampong Glam. Stamp respectfully from the edge, with no posing.","aliwal-arts-centre-courtyard":"A small arts centre and courtyard in Kampong Glam, with performances and street art.","jalan-besar-stadium-gate":"A football stadium gate with a long history of local matches.","petain-road-shophouses":"Pastel, tile-fronted terrace houses where people live. Stamp from the street and keep noise down.","sultan-plaza-rotunda":"A round retro-style building in the Kampong Glam area.","rochor-river-promenade":"A promenade by the Rochor Canal, a quiet walk between the busy roads of Bugis and Jalan Besar.","house-of-tan-teng-niah":"The last surviving Chinese villa in Little India, built around 1900 for a sweet-factory owner and painted in a rainbow of bright colours.","sri-veeramakaliamman-temple":"A Kali temple on Serangoon Road, one of the busiest and most colourful in Little India. Active worship, so stamp from outside and keep quiet.","sri-srinivasa-perumal-temple":"A Vishnu temple with a tall carved gopuram on Serangoon Road, where the Thaipusam procession is known to begin. Active worship.","abdul-gafoor-mosque":"A mosque on Dunlop Street, completed in 1907 for the Tamil and Baweanese Muslim community. An active place of worship, so dress modestly.","mustafa-centre-corner":"A busy shopping centre that stays open round the clock, at the corner of Syed Alwi Road.","tekka-centre-archway":"The hawker and market centre at the heart of Little India, busy with food stalls and fresh produce.","kampong-kapor-methodist-church":"A quasi-Art Deco church built in 1930, with services in several languages including Tamil, Mandarin and English. Active worship.","sakya-muni-buddha-gaya-temple":"Known as the Temple of 1,000 Lights, with a huge seated Buddha ringed by lamps. Free to enter; dress modestly.","leong-san-see-temple":"The ‘Dragon Mountain Temple’ on Race Course Road, with elaborate dragon carvings on its roof. Active worship.","former-changi-road-and-race-course-road-marker":"The site of the former Race Course Road market, a reminder of the everyday trading that once filled this part of Little India.","rowell-road-heritage-arch":"A row of colonial-era houses on Rowell Road, on the quiet edge of Little India.","dunlop-street-murals":"Bright murals along Dunlop Street that tell stories of the neighbourhood and its trades.","hindoo-road-lawn-and-playground":"A small open park off Hindoo Road, a neighbourhood green space close to the Jalan Besar shophouses.","jalan-besar-shophouse-trail":"Rows of conserved shophouses along Jalan Besar, where old hardware shops sit beside new cafés.","kinta-road-alley-murals":"Back-alley murals off Kinta Road, a quieter place to look for street art.","former-new-world-gate-arch":"The gate arch recalls the New World amusement park that once stood on Jalan Besar, a night-out favourite for generations.","farrer-park-field-plaque":"A sports arena at Farrer Park, on land that was once Singapore’s racecourse.","st-george-s-road-green-corridor":"A neighbourhood playground along St George’s Road.","tessensohn-road-clubhouses":"A row of old clubhouses on Tessensohn Road, once social hubs for the area’s communities.","moulmein-road-canal-footbridge":"The site of the former Cathay-Keris film studios in Siglap, built in 1953 from old Japanese barracks and closed in 1972. Nearby streets such as Jalan Buloh Perindu are named after its films. People live here, so stamp from the street.","block-78-moh-guan-terrace":"A horseshoe-shaped pre-war block with a purpose-built air-raid shelter, said to be the first of its kind in Singapore. People live here, so stamp from the street.","qi-tian-gong-temple":"The Monkey God temple, founded in 1920 as a small attap hut in a taro garden, now a landmark of Tiong Bahru. Active worship.","seng-poh-garden-dancing-girl-sculpture":"A 1.2-metre concrete sculpture of a girl in a joyful harvest dance, made in two weeks by Lim Nang Seng, who also designed the Merlion.","everton-road-peranakan-murals":"Murals on Everton Road that bring local heritage onto the shophouse walls.","henderson-waves":"Singapore’s highest pedestrian bridge, a curving wooden walkway high above Henderson Road.","faber-point-merlion-and-lookout":"A viewpoint on Mount Faber with sweeping views over the harbour, the city and Sentosa.","marang-trail-entrance":"A staircase climb through the rainforest on the Southern Ridges, leading up to Mount Faber.","keppel-bay-pontoon-bridge":"A floating walkway through Keppel Bay marina, with yachts moored on both sides.","labrador-battery-relics":"Remains of coastal defences from the Second World War, set in the greenery of Labrador Nature Reserve.","berlayer-creek-mangrove-boardwalk":"A boardwalk through the mangroves near Labrador, a quiet stretch of coast within the city.","bukit-purmei-hilltop-park":"A small hillock park with views over the surrounding estate.","former-tanjong-pagar-railway-station":"The old Tanjong Pagar railway station building, once the southern end of the Malayan railway.","spooner-road-old-railway-quarters":"Former railway staff quarters near Tiong Bahru, a reminder of the area’s railway past.","block-53-moh-guan-terrace-staircases":"A horseshoe-shaped pre-war block in Tiong Bahru, one of the estate’s Art Deco apartment blocks. People live here, so stamp from the street.","tbm":"A hawker centre and wet market on Seng Poh Road, rebuilt and reopened in 2006. Go in the morning when it is liveliest.","tiong-bahru-community-centre-heritage-wall":"A wall at the community centre that was one of the first built in Singapore, and still keeps the word ‘centre’ in its name.","kampong-bahru-shophouse-row":"A row of shophouses along Kampong Bahru Road, between the old Tiong Bahru estate and the Chinatown edge.","gurdwara-sahib-silat-road":"A Sikh temple in the Bukit Merah area. An active place of worship, so dress modestly and stamp from outside.","mount-faber-cable-car-plaza":"The plaza at the Mount Faber cable car station. The cable-car ride is ticketed; the plaza stamp is free.","koon-seng-road-shophouses":"A row of multicoloured Peranakan terrace houses, among the most photographed in Singapore. People live here, so keep noise down.","red-house-bakery-building":"The old Katong Bakery and Confectionery, a red-painted landmark whose facade has been kept as a café.","sri-senpaga-vinayagar-temple":"A Hindu temple on Ceylon Road with distinctive South Indian architecture. Active worship, so stamp from outside.","eurasian-heritage-gallery":"A small museum on Ceylon Road about the Eurasian community and its place in Katong. Check opening hours before you go.","east-coast-park-bedok-jetty":"A long fishing jetty reaching out into the sea, popular at sunrise and with anglers.","marine-parade-block-75-mosaic-wall":"A colourful mosaic wall in the Marine Parade estate, a piece of heartland art.","church-of-the-holy-family":"The Church of the Holy Family, a Katong landmark built in 1932 and known as Katong Catholic Church. Active worship.","telok-kurau-lorong-l-green-corridor":"A green walkway through Telok Kurau, between the quiet houses and the main road.","siglap-canal-coastal-exit":"A quiet coastal exit at Siglap Canal, where the canal meets East Coast Park.","old-queen-s-theatre-frontage":"The old theatre frontage in the Geylang area, a reminder of the cinemas that once drew crowds.","joo-chiat-complex-square":"A long-running retail complex at the top of Joo Chiat Road, full of Malay shops and local eateries.","ceylon-road-temple-enclave":"An Anglican church in the Katong area. Active worship, so stamp from outside.","marine-terrace-coastal-bridge":"A pedestrian underpass in the Marine Terrace area, part of the neighbourhood’s everyday routes.","east-coast-lagoon-food-village-pier":"A seafood food village by the sea at East Coast Lagoon, lively in the evening.","amber-road-roundhouse-shophouse":"A landmark sports club on Amber Road, started as a Straits Chinese answer to the European-only Singapore Swimming Club and on its present site since 1921. A members’ club, so stamp from the road.","meyer-road-villa-row":"A row of older villas on Meyer Road. People live here, so stamp from the street.","siglap-south-wind-chime-park":"A community centre in the Siglap South neighbourhood, a local hub for classes and events.","east-coast-park-bougainvillea-tower":"A bougainvillea garden along East Coast Park, bright with flowers beside the seafront.","kampong-ubi-community-club-corner":"A community club corner in the Ubi area, tied to the neighbourhood’s heritage.","tanjong-katong-complex-rotunda":"A rounded retro rotunda at Tanjong Katong Complex, a mark of the area’s shopping past.","tpd":"A dragon-shaped playground from 1979, kept when the blocks around it were redeveloped. Children play here, so stamp from the edge.","lian-shan-shuang-lin-monastery":"A large Buddhist monastery in Toa Payoh, with halls, courtyards and a quiet garden. Active worship, so keep voices low.","balestier-water-kiosk":"A neighbourhood market on Balestier Road, where locals buy everyday groceries and meals.","sun-yat-sen-nanyang-memorial-hall":"A villa linked to Dr Sun Yat Sen’s revolutionary movement in Southeast Asia, now a museum at the end of the Balestier Heritage Trail.","maha-sasanaramsi-burmese-buddhist-temple":"A temple serving Singapore’s Burmese Buddhist community, completed in 1991 on Tai Gin Road. Active worship, so dress modestly.","toa-payoh-town-park-look-out-tower":"A 25-metre lookout tower in Toa Payoh Town Park, a 1970s landmark in the middle of the estate.","bishan-interchange-clock-tower-playground":"A neighbourhood playground by Bishan Interchange, with a clock-tower theme.","bishan-ang-mo-kio-river-point":"A stretch of the Kallang River in Bishan–Ang Mo Kio Park, where a concrete canal was reshaped into a winding natural river.","whampoa-dragon-fountain":"A dragon fountain in the Whampoa estate, a quiet piece of heartland art.","toa-payoh-central-fountain-plaza":"A fountain plaza in the heart of Toa Payoh Central, where residents shop, eat and meet.","bishan-harmony-park-skate-pavilion":"A pavilion in Bishan’s Harmony Park, used by skaters and people out for a stroll.","balestier-shophouse-corner-sim-kwong-ho":"A row of traditional shophouses on Balestier Road, one of the stops on NHB’s Balestier Heritage Trail.","goh-chor-tua-pek-kong-temple":"A little red-brick temple established in 1847, the oldest religious institution in the Balestier neighbourhood. Active worship.","ah-hood-road-canal-walkway":"A community space at Tai Gin Road in the Balestier area.","kallang-river-promenade-at-kolam-ayer":"A stretch of the Kallang River redesigned under PUB’s ABC Waters programme, with a waterfront for walks and leisure.","toa-payoh-block-1-sensory-park":"A sensory garden near Block 1, Toa Payoh, with plants chosen for touch, smell and sound.","bishan-north-park-pavilion":"A neighbourhood park in Bishan North, with paths and play areas for residents.","whampoa-makan-place":"A hawker centre on the Balestier Heritage Trail, popular with locals for everyday meals.","saint-andrew-s-village-bridge-view":"A village-like neighbourhood off Francis Thomas Drive. Check its history locally before publishing.","tanglin-halt-block-48-and-railway-crossing":"Named after the old Tanglin Halt train stop on the KTM line, whose tracks are now a green corridor. The estate has been slated for redevelopment, so check what still stands.","queenstown-church-of-the-good-shepherd":"A church on NHB’s Queenstown heritage trail. Active worship, so stamp from outside.","wessex-estate-bungalows":"Black-and-white colonial bungalows tucked among greenery in Wessex Estate. People live here, so stamp from the street.","colbar-wessex-estate":"A rustic diner that first opened in 1953 and was moved from Jalan Hang Jebat to Wessex Estate, a popular local hangout.","botanic-gardens-bandstand":"A bandstand in the Singapore Botanic Gardens, a UNESCO World Heritage Site and one of the city’s favourite green spaces.","botanic-gardens-eco-lake-footbridge":"A footbridge over the Eco-Lake in the Botanic Gardens, with reflections and waterlilies.","bukit-timah-railway-station":"The preserved Bukit Timah railway station building, a relic of the old KTM line, now close to the Rail Corridor.","hindhede-quarry-viewpoint":"A viewpoint over the flooded granite quarry at Hindhede, beside the Bukit Timah Nature Reserve.","bukit-timah-summit-marker":"The summit of Bukit Timah Hill, the highest natural point in Singapore at around 164 metres.","former-ford-factory":"The former Ford factory where British forces surrendered in February 1942. It is now a museum on Upper Bukit Timah Road.","skv":"A rooftop garden on a public housing complex, open to the public. It is also residents’ home, so keep quiet and avoid New Year’s Eve and National Day.","commonwealth-drive-block-38-market":"A market on Commonwealth Drive, part of the first satellite estate’s everyday life.","queenstown-public-library":"A branch library on NHB’s Queenstown trail, in Singapor 0 kinds of fruit trees.","sengkang-floating-wetland":"A floating wetland of aquatic plants in the Punggol River, with a fruit-themed boardwalk and orange-slice seats.","sengkang-sculpture-park":"A park with giant sculpture play structures, a favourite with families.","punggol-park":"A therapeutic garden in Punggol Park, designed as a calm space for relaxation and gentle activity.","chomp-chomp-food-centre":"A lively open-air food centre in Serangoon Gardens, busiest in the evening.","serangoon-gardens-circus":"The round centre of the Serangoon Gardens estate, a neighbourhood of low-rise houses and local shops.","bishan-ang-mo-kio-park":"One of the city’s most popular parks, where a concrete canal has been reshaped into a winding natural river.","ang-mo-kio-town-garden-west":"A town garden with a lake and pavilions in the middle of Ang Mo Kio.","kebun-baru-birdsinging-club":"A community bird-singing club where owners hang their songbirds in cages, best on weekend mornings.","bedok-reservoir-park":"A popular park around Bedok Reservoir, on NHB’s Tampines Heritage Trail.","bedok-town-park":"A neighbourhood town park in Bedok, with paths and green lawns.","bedok-85-fengshan-market-and-food-centre":"A big hawker centre and wet market in Bedok, busy at breakfast and lunch.","katong-park":"A small park in the Katong area, with shady trees and a neighbourhood feel.","marine-parade-central-market-and-food-centre":"A hawker centre and market at the heart of the Marine Parade estate.","marine-cove":"A seaside spot beside East Coast Park, with views of the sea and ships on the horizon.","east-coast-park-parkland-green":"A stretch of East Coast Park with open lawns, cycle paths and the sea beyond.","lau-pa-sat":"A Victorian cast-iron market turned hawker centre, famous for its satay street at night.","lim-bo-seng-memorial":"A memorial in Esplanade Park to the resistance fighter Lim Bo Seng. Visit respectfully.","marina-bay-sands-event-plaza":"A waterfront plaza with sweeping views of the Marina Bay skyline.","singapore-flyer-ground-stamp":"The giant observation wheel beside Marina Bay. Stamp at ground level; the ride is ticketed.","cathedral-of-the-good-shepherd":"Singapore’s oldest Catholic church, a white colonial building near Bras Basah. Active worship, so stamp from outside.","maghain-aboth-synagogue":"Singapore’s oldest synagogue, on Waterloo Street. Active worship; check visiting rules and stamp from outside.","singapore-art-museum-at-8q":"A former school building turned contemporary art museum, with a lively courtyard.","bugis-street":"A lively street market of clothes, snacks and souvenirs in the middle of Bugis.","botanic-gardens-swan-lake":"A lake in the Singapore Botanic Gardens, a UNESCO World Heritage Site, with swans and shaded lawns.","botanic-gardens-jacob-ballas-children-s-garden":"A garden in the Botanic Gardens built for children to play and learn about plants.","botanic-gardens-learning-forest":"A forest boardwalk in the Botanic Gardens, with tall trees and elevated paths.","dempsey-hill":"A former army barracks area turned cafés and restaurants, set among tall trees.","holland-village":"A lively neighbourhood of cafés, bars and boutiques, popular with locals and expatriates.","national-orchid-garden-ground-stamp":"A showcase of orchids inside the Botanic Gardens. Stamp outside the gate; entry is ticketed.","haw-par-villa":"A theme park of Chinese mythology, with thousands of statues and dioramas. Free to enter; some scenes are graphic.","reflections-at-bukit-chandu":"A museum about the Battle of Pasir Panjang in 1942. Visit respectfully.","kent-ridge-park-canopy-walk":"An elevated walkway through the treetops of Kent Ridge Park, with views over the city.","clementi-woods-park":"A small wooded park in Clementi, a green pocket within the estate.","siloso-beach-sentosa":"A busy beach on Sentosa, with views of ships and the southern islands. Some areas of Sentosa are paid.","palawan-beach-sentosa":"A family beach on Sento const NOTE={c:"A People’s Association community club. Stamp from outside; opening hours vary.",w:"Active place of worship. Stamp from outside, keep quiet and respect worshippers.",r:"People live here. Stamp from the street and keep noise down.",m:"A memorial or burial ground. Visit respectfully, with no posing or celebrating.",b:"Needs a ferry or boat. Check schedules before you go."};
const CAT={t:"temple",s:"shop",o:"tower",m:"mosque",p:"park"};
const slug=n=>n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const OV={klb:{note:"Private land where families live. Stamp at the entrance off Lorong Buangkok and do not walk in without an authorised guide.",r:200}};
const ZONES=[];
RAW.split("\n").forEach(l=>{if(l[0]==="#"){const[n,b]=l.slice(1).split("|");ZONES.push({id:slug(n),name:n,blurb:b,spots:[]})}else if(l.trim()){const[n,c,f="",o]=l.split("|"),B=OLD[o]||{},id=o||slug(n);ZONES[ZONES.length-1].spots.push(Object.assign({id,name:NM[id]||n,cat:CAT[c],lat:CO[id]?CO[id][0]:B.lat,lng:CO[id]?CO[id][1]:B.lng,r:B.r||120,ok:B.ok,note:B.note||[...f].map(k=>NOTE[k]).filter(Boolean).join(" ")||"Find the spot, take in the view and stamp it.",acc:B.acc||(f.includes("b")?"Boat needed":f.includes("w")?"Free, respectful visit":"Free")},OV[id]))}});
const $=s=>document.querySelector(s);
let zone=ZONES[0].id,mom="auto",stamps={};
try{stamps=JSON.parse(localStorage.getItem("sbsg")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("sbsg",JSON.stringify(stamps))}catch(e){}};
function nowMoment(){const h=new Date().getHours();return h>=5&&h<11?"morning":h>=11&&h<17?"midday":h>=17&&h<20?"evening":"night"}
const cur=()=>mom==="auto"?nowMoment():mom;
function art(cat,m,id){
const [a,b,s]=PAL[m],n=m==="night",f=n?"#0e1233":m==="evening"?"#3a2759":"#2d4a47",f2=n?"#1d2250":m==="evening"?"#5c3d7a":"#4f7a72";
let g="";
if(cat==="temple")g=`<path d="M22 88Q80 44 138 88L138 96H22Z" fill="${f}"/><path d="M40 88Q80 62 120 88Z" fill="${f2}"/><rect x="48" y="88" width="64" height="26" fill="${f2}"/><rect x="74" y="96" width="12" height="18" fill="${f}"/>`;
else if(cat==="shop")g=[0,1,2,3].map(i=>`<rect x="${14+i*36}" y="${58+(i%2)*10}" width="32" height="${56-(i%2)*10}" fill="${i%2?f2:f}"/><rect x="${22+i*36}" y="${70+(i%2)*10}" width="7" height="10" fill="${n?s:b}" opacity=".8"/>`).join("");
else if(cat==="tower")g=`<rect x="40" y="26" width="26" height="88" fill="${f}"/><rect x="72" y="14" width="26" height="100" fill="${f2}"/><rect x="104" y="34" width="22" height="80" fill="${f}"/><rect x="40" y="52" width="86" height="5" fill="${n?s:"#7fbf8e"}" opacity=".7"/>`;
else if(cat==="mosque")g=`<rect x="44" y="80" width="72" height="34" fill="${f}"/><circle cx="80" cy="80" r="24" fill="${f2}"/><rect x="79" y="48" width="2" height="10" fill="${f}"/><rect x="124" y="46" width="8" height="68" fill="${f}"/>`;
else g=`<circle cx="46" cy="84" r="20" fill="${f2}"/><circle cx="108" cy="80" r="24" fill="${f}"/><rect x="0" y="104" width="160" height="10" fill="${f}"/><path d="M60 114Q80 100 100 114Z" fill="${f2}"/>`;
const sun=n?`<circle cx="124" cy="26" r="9" fill="${s}"/><circle class="tw" cx="30" cy="22" r="1.6" fill="#fff"/><circle class="tw" cx="62" cy="38" r="1.3" fill="#fff" style="animation-delay:.8s"/><circle class="tw" cx="96" cy="16" r="1.5" fill="#fff" style="animation-delay:1.5s"/>`:`<circle cx="${m==="evening"?118:m==="morning"?34:80}" cy="${m==="midday"?22:44}" r="13" fill="${s}"/>`;
return `<svg viewBox="0 0 160 114" role="img" data-m="${m}" aria-label="${cat} scene at ${m}"><defs><linearGradient id="g${id}${m}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="160" height="114" fill="url(#g${id}${m})"/>${sun}${g}</svg>`}
function got(id){return stamps[id]||{}}
function render(){
$("#moments").innerHTML=MOM.map(([k,l])=>`<button class="chip" data-m="${k}" aria-pressed="${k===mom}">${l}</button>`).join("");
$("#tabs").innerHTML=ZONES.map(z=>{const c=z.spots.filter(s=>Object.keys(got(s.id)).length).length;return `<button class="tab" role="tab" data-z="${z.id}" aria-selected="${z.id===zone}">${z.name}<small>${c} of ${z.spots.length} stamped</small></button>`}).join("");
const z=ZONES.find(x=>x.id===zone);$("#sub").textContent=z.blurb;
$("#grid").innerHTML=z.spots.map(s=>{const g=got(s.id),ks=Object.keys(g),has=ks.length,shown=has&&!g[cur()]?ks[ks.length-1]:cur();
return `<button class="spot" data-s="${s.id}"><div class="frame ${has?"":"locked"}">${art(s.cat,shown,s.id)}${has?`<div class="postmark">${shown.toUpperCase()}</div>`:""}</div><div class="name">${s.name}</div><div class="dots" aria-label="${ks.length} of 4 moments">${["morning","midday","evening","night"].map(k=>`<i class="${g[k]?"on":""}"></i>`).join("")}</div></button>`}).join("")}
function dist(a,b,c,d){const R=6371000,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b),h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function open(id){
const s=ZONES.flatMap(z=>z.spots).find(x=>x.id===id),m=cur(),g=got(id);
$("#sheet").innerHTML=`<div class="frame ${Object.keys(g).length?"":"locked"}">${art(s.cat,m,s.id+"d")}</div><h2>${s.name}</h2><p class="desc">${DS[s.id]||""}</p>${s.note&&s.note!=="Find the spot, take in the view and stamp it."?`<p class="meta"><b>Visiting note:</b> ${s.note}</p>`:""}<span class="badge">${s.acc}</span>${s.lat?`<span class="badge">Check-in radius ${s.r} m</span>`+(s.ok?"":'<span class="badge">Pin not yet checked on site</span>'):'<span class="badge">GPS spot not set yet</span>'}<span class="badge">Art: placeholder</span><span class="badge">Description: draft</span>
${s.lat?`<button class="btn" id="go">Stamp it (${m})</button>`:""}<button class="btn alt" id="demo">Demo: pretend I’m here</button><button class="btn alt" id="close">Close</button><p class="msg" id="msg" role="status"></p>`;
$("#dlg").showModal();
$("#close").onclick=()=>$("#dlg").close();
const ink=()=>{const g2=stamps[id]||(stamps[id]={});g2[m]=Date.now();save();render();$("#sheet").querySelector(".frame").classList.remove("locked");$("#sheet").querySelector(".frame").insertAdjacentHTML("beforeend",`<div class="postmark thunk">${m.toUpperCase()}</div>`);$("#msg").textContent="Stamped. This moment is in your book."};
$("#demo").onclick=ink;
if(s.lat)$("#go").onclick=()=>{const msg=$("#msg");if(!navigator.geolocation){msg.textContent="This browser can’t share location. Use the demo button.";return}
msg.textContent="Checking where you are, once…";
navigator.geolocation.getCurrentPosition(p=>{const d=Math.round(dist(p.coords.latitude,p.coords.longitude,s.lat,s.lng));d<=s.r?ink():msg.textContent=`You’re about ${d} m away. Get within ${s.r} m to stamp.`},()=>{msg.textContent="Location is blocked or unavailable here. Allow it in your browser, or use the demo button."},{enableHighAccuracy:true,timeout:10000,maximumAge:0})}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-m],[data-z],[data-s]");if(!t)return;
if(t.dataset.m){mom=t.dataset.m;render()}else if(t.dataset.z){zone=t.dataset.z;render()}else open(t.dataset.s)});
$("#reset").onclick=()=>{if(confirm("Clear all your stamps?")){stamps={};save();render()}};

const MN={morning:"morning",midday:"noon",evening:"evening",night:"night"};
function setImg(frame,id){if(!frame||frame.querySelector(".photo"))return;const sv=frame.querySelector("svg");if(!sv)return;const m=MN[sv.dataset.m]||"noon";
const b="images/"+id,tries=[b+"-"+m+".jpg",b+"-"+m+".png",b+"-"+m+".webp",b+".jpg"];let i=0;const im=new Image();im.className="photo";im.alt="";
im.onload=()=>{if(sv.isConnected)sv.replaceWith(im)};im.onerror=()=>{i++;if(i<tries.length)im.src=tries[i]};im.src=tries[0]}
function upgrade(){document.querySelectorAll(".spot[data-s]").forEach(b=>setImg(b.querySelector(".frame"),b.dataset.s))}
const _render=render;render=function(){_render();upgrade()};
const _open=open;open=function(id){_open(id);setImg(document.querySelector("#sheet .frame"),id)};
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
